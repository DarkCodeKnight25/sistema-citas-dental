spring.application.name=citas-dental

# Base de datos: PostgreSQL local con docker compose; en producci\u00f3n se usan las variables de Neon.
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5433/citas}
spring.datasource.username=${DATABASE_USER:citas}
spring.datasource.password=${DATABASE_PASSWORD:citas}
spring.datasource.hikari.maximum-pool-size=5
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=America/Lima
spring.flyway.locations=classpath:db/migration

server.port=${PORT:8081}
server.error.include-message=never
management.endpoints.web.exposure.include=health

app.jwt.secreto=${JWT_SECRET:solo-para-desarrollo-cambiar-en-produccion-32+}
app.cors.origenes=${CORS_ORIGENES:http://localhost:5173,http://127.0.0.1:5173}

app.clinica.nombre=Dental Qori
# Los acentos van como \u00f3: Spring lee los .properties en ISO-8859-1.
app.clinica.direccion=Av. Los Pr\u00f3ceres 000, Santa Anita (direcci\u00f3n de demostraci\u00f3n)
app.clinica.referencia=frente al parque, segundo piso
app.clinica.celular=900000000
app.clinica.whatsapp-demo=${WHATSAPP_DEMO:true}
app.clinica.anticipacion-web-min=60

app.demo.cargar=${DEMO_CARGAR:true}
# Cron de reinicio diario de la demo; "-" lo desactiva.
app.demo.reinicio-cron=${DEMO_REINICIO_CRON:-}
